name: Deploy
run-name: 'Deploy to: ${{ inputs.environment }}'

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      SANITY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        required: true
        description: Deployment environment
        type: choice
        options:
          - stage
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Deploy to: ${{ inputs.environment }}'
    if: inputs.environment == 'stage' || inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: '${{ inputs.environment }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Sanity
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: npm run deploy -- --yes

      - name: Add deployment summary
        run: |
          echo 'Success! Studio deployed to [https://junviglund.sanity.studio](https://junviglund.sanity.studio)' >> "$GITHUB_STEP_SUMMARY"
